name: Daily Briefing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: America/Detroit
      BRIEFING_SKIP_CALENDAR: "1"
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Generate briefing text
        run: python daily_briefing.py > briefing.txt

      - name: Synthesize speech (Libby)
        run: edge-tts --voice en-GB-LibbyNeural --file briefing.txt --write-media daily_briefing.mp3

      - name: Commit the MP3
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add daily_briefing.mp3
          git commit -m "Daily briefing $(date +%Y-%m-%d)" || echo "No changes"
          git push
